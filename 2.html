<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crown Dominion</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161f;--stone:#2a2e3dee;--st2:#3a3f54;--gold:#e8b93c;--red:#c2343f;--blue:#4d8fd6;--text:#f1ede2;--mute:#a2a4b6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Rubik',system-ui,Arial,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
.ui button,.sheet,.pill,.bt .card{pointer-events:auto}
.hud{display:flex;justify-content:space-between;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0}
.pill{background:var(--stone);border:1px solid var(--st2);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px}
.bot{display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 14px;font-weight:600;color:var(--text);background:var(--st2)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.go{background:var(--red);font-size:19px;padding:15px;margin:0 16px 10px;font-weight:800;box-shadow:0 4px 0 #7d1e26}
nav{display:flex;background:#10121bf2;border-top:1px solid var(--st2);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;background:none;font-size:12px;padding:6px 0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--gold)}
.sheet{background:var(--stone);border-top:1px solid var(--st2);border-radius:18px 18px 0 0;padding:14px;max-height:52vh;overflow:auto}
.sheet h2{margin:0 0 8px;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--st2)}
.row:last-child{border:0}
.row.me{color:var(--gold);font-weight:800}
.sub{color:var(--mute);font-size:13px}
.gb{background:var(--gold);color:#241c05;min-width:84px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:#0e1018;border-radius:12px;padding:10px;text-align:center;border:2px solid transparent}
.item.eq{border-color:var(--gold)}
.sw{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;border:2px solid #fff6}
.bt{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0}
.bar{height:12px;background:#0e1018;border-radius:8px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;transition:width .4s}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}
.log{margin:2px 12px calc(env(safe-area-inset-bottom,0px) + 6px);height:18px;overflow:hidden;font-size:12px;color:var(--text);text-shadow:0 1px 3px #000;text-align:center}
.log b{color:var(--text)}
.res{text-align:center;font-size:22px;font-weight:800;margin:0 12px 8px;text-shadow:0 2px 6px #000}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 8px}
.acts button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 1px;background:#2a2e3dd0;border:1px solid var(--st2);font-size:11px;line-height:1.1}
.acts button.cool{filter:grayscale(.7);opacity:.7}
.acts img{width:100%;max-width:38px;aspect-ratio:1;border-radius:10px}
.acts small{color:#c9a7ff;font-weight:700;font-size:12px}
.eb{height:16px;background:#0e1018;border-radius:8px;overflow:hidden;margin:3px 12px;position:relative}
.eb i{display:block;height:100%;background:linear-gradient(90deg,#8a5cf5,#c06bff);width:50%;transition:width .1s}
.eb span{position:absolute;inset:0;text-align:center;font-size:12px;font-weight:700;line-height:16px}
.q{width:100%;padding:11px;border-radius:12px;border:1px solid var(--st2);background:#0e1018;color:var(--text);font:inherit;margin-bottom:8px}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:8px 4px;font-size:13px}.seg button.on{background:var(--gold);color:#241c05}
.ci{width:84px;height:84px;border-radius:12px;display:inline-block;background:#2b3552}
#op,#set,#vic,#auth,#chat,#info{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:5;overflow:auto}
#opG{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;width:100%}
.pop{animation:pop .5s both}@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
button.pill{color:var(--text);font:inherit;font-weight:600;font-size:14px}
.hud{flex-wrap:wrap;justify-content:flex-start}
.cdm{position:absolute;left:0;right:0;bottom:0;height:0;background:#000b;pointer-events:none}
.pt{width:46px;height:46px;border-radius:8px}
#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:4;width:38px;height:38px;border-radius:50%;padding:0;font-size:20px;background:var(--stone);border:1px solid var(--st2)}
.hud,.bars{padding-right:58px}
#lane button{padding:5px;font-size:12px}#lane{margin-bottom:3px}
nav i{font-style:normal}
#setB{background:var(--stone);border-radius:14px;padding:6px 12px;width:min(420px,100%)}
.opt{display:flex;gap:6px}.opt button{padding:7px 10px;font-size:13px}.opt button.on,#setB button.on{background:var(--gold);color:#241c05}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.g3 .item{padding:6px;font-size:12px}.g3 .ci{width:60px;height:60px}
button.item{background:#0e1018;font-weight:400;color:var(--text)}
.deck{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}.deck .item,.deck .slot{padding:3px;font-size:10px;line-height:1.1}.deck .ci{width:100%;height:auto;aspect-ratio:1}
.slot{border:2px dashed var(--st2);border-radius:12px;display:grid;place-items:center;color:var(--mute);min-height:70px}
#vicB,#auB,#infB{width:min(420px,100%);background:var(--stone);border-radius:14px;padding:6px 12px;max-height:60vh;overflow:auto}
.g5{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}.g5 .ci{width:60px;height:60px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 16px 8px;background:var(--stone);border:1px solid var(--st2);border-radius:14px;padding:8px 12px;font-size:13px;pointer-events:auto}
#auB{background:var(--stone);border-radius:14px;padding:10px 12px}
#chB{width:min(420px,100%);height:45vh;overflow:auto;background:var(--stone);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;padding:6px 10px;border-radius:12px;background:#3a3f54;align-self:flex-start;word-break:break-word}.msg.me{background:#4a3d14;align-self:flex-end}
.chin{display:flex;gap:6px;width:min(420px,100%)}.chin .q{margin:0;flex:1}
.item{position:relative}.inf{position:absolute;top:2px;right:4px;font-size:12px;cursor:pointer;z-index:1}[data-info]{cursor:pointer}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.pop{animation:none}}
</style>
</head>

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.connect(AC.destination)}catch(e){return null}}if(AC.state==='suspended')AC.resume();mg.gain.value=ST.vol;return AC}
function tone(f,d,ty,v,f2,dl){const a=ac();if(!a)return;const t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
function noise(d,v){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v||.2;s.connect(g);g.connect(mg);s.start()}

 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,0,i*.14)),lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',.1,0,i*.18)),open:()=>[659,784,988,1319,1568].forEach((f,i)=>tone(f,.2,'sine',.14,0,i*.09)),up:()=>{tone(440,.1,'triangle',.12);tone(880,.2,'triangle',.12,0,.1)}};

/* ---------- Game accounts ---------- */
let amode='login',sess=null;try{sess=JSON.parse(localStorage.getItem('cdSess')||'null')}catch(e){}
const EM=u=>u.toLowerCase()+'@crowndominion.app';
async function getDB(){DB=sb;return DB}
async function pbk(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256);
 return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const keep=(u,h)=>{sess={u,h};try{localStorage.setItem('cdSess',JSON.stringify(sess))}catch(e){}};
function updLogin(){$('login').textContent=UID?'👤 '+UNAME:L('login')}
function afterAuth(){updLogin();hud();G(rebuild);if(tab!=='battle')sheet(tab);save()}
async function myName(u){try{const{data}=await sb.from('profiles').select('name').eq('id',UID).single();return data&&data.name||u}catch(e){return u}}
async function loadSave(){try{const{data}=await sb.from('saves').select('data').eq('user_id',UID).maybeSingle();if(data&&data.data){S={...DEF,...data.data};fixDeck()}}catch(e){}afterAuth()}
async function authReg(u,pw,dn){const{data,error}=await sb.auth.signUp({email:EM(u),password:pw,options:{data:{username:u.toLowerCase(),name:dn||u}}});
 if(error)throw/registered|exists|Database/i.test(error.message)?'taken':'db';
 if(!data.session)throw'confirm';UID=data.user.id;UNAME=dn||u;afterAuth()}
async function authLogin(u,pw){const{data,error}=await sb.auth.signInWithPassword({email:EM(u),password:pw});if(error)throw/invalid|credentials/i.test(error.message)?'badpw':'db';
 UID=data.user.id;UNAME=await myName(u);await loadSave()}
async function resume(){if(!sb)return;try{const{data}=await sb.auth.getSession();if(data.session){UID=data.session.user.id;UNAME=await myName('?');await loadSave()}}catch(e){}}
function openAuth(){$('auT').textContent='👤 '+L('auT');const b=$('auB');
 if(UID)b.innerHTML=`<div class="row"><b>${esc(UNAME)}</b><span>${lvBadge(S.pass||0)}</span></div><div class="row sub"><span>@${esc(UID)}</span><span>👑 ${S.crowns}</span></div><button id="aOut" class="go" style="margin:10px 0 0;width:100%">${L('aOut')}</button>`;
 else b.innerHTML=`<div class="seg"><button data-am="login" class="${amode==='login'?'on':''}">${L('aLogin')}</button><button data-am="reg" class="${amode==='reg'?'on':''}">${L('aReg')}</button></div>
 <input id="aU" class="q" placeholder="${L('aUser')}" autocomplete="username" autocapitalize="none" maxlength="16" dir="ltr">
 ${amode==='reg'?`<input id="aN" class="q" placeholder="${L('aName')}" maxlength="16">`:''}
 <input id="aP" class="q" type="password" placeholder="${L('aPw')}" autocomplete="${amode==='reg'?'new-password':'current-password'}" dir="ltr">
 <div class="sub" id="aM" style="min-height:18px;color:#ff8a8a"></div>
 <button class="go" id="aGo" style="margin:6px 0;width:100%">${L(amode==='reg'?'aReg':'aLogin')}</button><div class="sub">${L('aNote')}</div>`;
 $('auth').classList.remove('hide')}
async function submit(){const u=$('aU').value.trim(),p=$('aP').value,n=$('aN')?$('aN').value.trim():'',m=$('aM'),go=$('aGo');
 if(!/^[A-Za-z0-9_]{3,16}$/.test(u)||p.length<6){m.textContent=L('eFmt');return}
 go.disabled=true;m.textContent='…';
 try{if(!(await getDB()))throw'db';if(amode==='reg')await authReg(u,p,n);else await authLogin(u,p);$('auth').classList.add('hide')}
 catch(e){m.textContent=L({taken:'eTaken',nouser:'eNo',badpw:'ePw',confirm:'eConf'}[e]||'eDb');go.disabled=false}}
$('auB').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.am){amode=b.dataset.am;openAuth();return}
 if(b.id==='aGo')submit();
 if(b.id==='aOut'){if(sb)sb.auth.signOut();UID=null;UNAME='';sess=null;try{localStorage.removeItem('cdSess')}catch(e){}S={...DEF};fixDeck();save();G(rebuild);updLogin();hud();if(tab!=='battle')sheet(tab);$('auth').classList.add('hide')}};
$('auB').addEventListener('keydown',e=>{if(e.key==='Enter'&&$('aGo'))submit()});
$('auX').onclick=()=>$('auth').classList.add('hide');
$('login').onclick=openAuth;
$('pgB').onclick=()=>setTab('pass');
$('vicX').onclick=()=>{$('vic').classList.add('hide');$('back').onclick()};
/* settings + language */
function applyLang(){const h=document.documentElement;h.lang=ST.lang;h.dir=ST.lang==='he'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=L(e.dataset.i));
 updLogin();
 if(typeof B!=='undefined'&&B&&inB&&!B.over)drawHand();else if(tab!=='battle')sheet(tab);hud()}
function openSet(){const o=(k,v,lab)=>`<button data-s="${k}:${v}" class="${ST[k]==v?'on':''}">${lab}</button>`;
 $('setT').textContent='⚙️ '+L('set');
 $('setB').innerHTML=`<div class="row"><b>${L('lang')}</b><div class="opt">${o('lang','he','עברית')}${o('lang','en','English')}</div></div>
 <div class="row"><b>${L('sfx')}</b><div class="opt">${o('sfx',1,L('on'))}${o('sfx',0,L('off'))}</div></div>
 <div class="row"><b>${L('mus')}</b><div class="opt">${o('music',1,L('on'))}${o('music',0,L('off'))}</div></div>
 <div class="row"><b>${L('vol')}</b><input type="range" id="vol" min="0" max="1" step=".05" value="${ST.vol}"></div>
 <div class="row"><b>${L('gfx')}</b><div class="opt">${o('gfx','low',L('low'))}${o('gfx','med',L('med'))}${o('gfx','high',L('high'))}</div></div>
 <div class="row" style="flex-wrap:wrap;gap:6px"><b>🔑 ${L('secT')}</b><div class="opt"><input id="sc" class="q" style="margin:0;width:130px" inputmode="numeric" autocomplete="off" placeholder="••••••"><button data-s="code">${L('secGo')}</button></div></div>
 ${SEC?`<div class="row" style="flex-wrap:wrap;gap:6px"><div class="opt"><span>🪙</span><input id="scG" class="q" type="number" min="0" style="margin:0;width:110px" value="${S.gold}"></div><div class="opt"><span>👑</span><input id="scC" class="q" type="number" min="0" style="margin:0;width:110px" value="${S.crowns}"></div><button data-s="cheat">${L('secApply')}</button></div>`:''}
 <div class="sub" id="scM"></div>
 <div class="row"><button data-s="reset">${L('reset')}</button></div>`;$('set').classList.remove('hide')}
let rs1=0,SEC=false;
$('gear').onclick=openSet;$('setX').onclick=()=>{$('set').classList.add('hide');rs1=0};
$('setB').addEventListener('input',e=>{if(e.target.id==='vol'){ST.vol=+e.target.value;saveST();if(mg)mg.gain.value=ST.vol;sfx('click')}});
$('setB').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.s;
 if(v==='reset'){if(!rs1){rs1=1;b.textContent=L('resetQ');return}rs1=0;S={...DEF};save();G(rebuild);hud();if(tab!=='battle')sheet(tab);$('set').classList.add('hide');return}
 if(v==='code'){SEC=$('sc').value.trim()==='4908608';openSet();$('scM').textContent=L(SEC?'secOk':'secBad');return}
 if(v==='cheat'){const n=id=>Math.max(0,Math.min(1e9,Math.floor(+$(id).value)||0));S.gold=n('scG');S.crowns=n('scC');for(const k in CARDS)S.cards[k]=512;S.keep=S.wall=S.barracks=MAXU;S.upg=null;fixDeck();save();hud();G(rebuild);if(tab!=='battle')sheet(tab);$('scM').textContent=L('secDone');return}
 const[k,x]=v.split(':');ST[k]=(k==='lang'||k==='gfx')?x:+x;saveST();
 if(k==='music')music();if(k==='gfx')G(applyGfx);applyLang();openSet()};

/* ---------- Battle ---------- */
let B,tm,lane=1,PF=[];
const TZ=14,NM=['Falcon','Ember','StoneFist','Vex','Rook','Ash'];
function puff(x,y,z,c,n){if(ST.gfx==='low'||PF.length>70||!ok)return;for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.13,6,5),new THREE.MeshBasicMaterial({color:c,transparent:true}));m.position.set(x,y,z);sc.add(m);PF.push({m,v:new THREE.Vector3(rnd(-10,10)/10,rnd(8,18)/10,rnd(-10,10)/10),l:0})}}
function parts(dt){PF=PF.filter(p=>{p.l+=dt;p.m.position.addScaledVector(p.v,dt);p.m.material.opacity=Math.max(0,1-p.l/.6);if(p.l>=.6){sc.remove(p.m);p.m.material.dispose();return false}return true})}
function drawHand(){B.hand=[...S.deck];
 $('acts').innerHTML=B.hand.map((k,i)=>`<button data-k="${i}" id="c${i}">${img(k)}<b>${role(k)}</b><small>⚡${CARDS[k].cost}</small></button>`).join('')}
function log(t){$('log').textContent=t}
function startBattle(name,lv,ef){if(S.deck.length<1)fixDeck();lv=lv||Math.min(5,1+Math.ceil(S.keep/2));ef=ef||1;name=name||'AI '+NM[rnd(0,5)];
 const mm=1200+S.keep*200,mx=1200+lv*200;
 B={mm,mx,me:mm,en:mx,e:{me:5,ai:5},ef,lv,name,over:false,t:180,u:[],w:[],bolts:[],tw:{me:0,ai:0},nextAI:Date.now()+5000,hand:null};
 inB=true;$('hud').classList.add('hide');$('home').classList.add('hide');$('bt').classList.remove('hide');
 for(const x of['acts','lane'])$(x).classList.remove('hide');$('back').classList.add('hide');$('res').classList.add('hide');
 $('enN').textContent='🤖 '+name;
 G(()=>{sc.remove(me);idle.forEach(w=>w.visible=false);me=mkTower(Math.min(S.keep,3),0,0x2f6fd0,col(S.crown),0x2f6fd0);me.userData.bx=0;me.position.set(0,0,TZ);sc.add(me);
  en=mkTower(Math.min(lv,3),0,0x8a2a9a,0xb02040,0xa02a3a);en.userData.bx=0;en.position.set(0,0,-TZ);sc.add(en)});
 drawHand();log(L('hint'));upd();clearInterval(tm);tm=setInterval(tick,100)}
function upd(){$('hpMe').style.width=Math.max(0,B.me/B.mm*100)+'%';$('hpEn').style.width=Math.max(0,B.en/B.mx*100)+'%';
 $('hpMeT').textContent=Math.max(0,Math.round(B.me))+' / '+B.mm;$('hpEnT').textContent=Math.max(0,Math.round(B.en))+' / '+B.mx;
 G(()=>{me.scale.y=.45+.55*Math.max(0,B.me)/B.mm;en.scale.y=.45+.55*Math.max(0,B.en)/B.mx})}
function tick(){if(!B||B.over)return;const dt=.1;B.t-=dt;
 B.e.me=Math.min(10,B.e.me+(.62+.05*(S.barracks-1))*dt);B.e.ai=Math.min(10,B.e.ai+.55*B.ef*dt);
 $('tmr').textContent='⏱ '+Math.floor(B.t/60)+':'+String(Math.floor(B.t%60)).padStart(2,'0');
 $('enb').style.width=B.e.me*10+'%';$('ent').textContent='⚡ '+Math.floor(B.e.me);
 B.hand.forEach((k,i)=>{const b=$('c'+i);if(b)b.classList.toggle('cool',B.e.me<CARDS[k].cost)});
 if(Date.now()>=B.nextAI){aiPlay();B.nextAI=Date.now()+rnd(3500,6000)/B.ef}
 upd();if(B.t<=0)finish(B.me>B.en?'win':B.me<B.en?'lose':'draw')}
function play(i){if(!B||B.over)return;const k=B.hand[i],c=CARDS[k];if(!c||B.e.me<c.cost)return;
 B.e.me-=c.cost;deploy('me',k,lane)}
function aiPlay(){if(B.over)return;const ids=Object.keys(CARDS).filter(k=>CARDS[k].cost<=B.e.ai&&CARDS[k].cost<=B.lv+3&&(!CARDS[k].rare||B.lv>=3));if(!ids.length)return;
 let k=ids[rnd(0,ids.length-1)];
 if(B.u.filter(u=>u.s==='me'&&!u.dead).length>=3){const g=ids.filter(x=>CARDS[x].hold&&!CARDS[x].heal);if(g.length&&Math.random()<.6)k=g[rnd(0,g.length-1)]}
 if(CARDS[k].wall&&B.w.some(w=>w.s==='ai'&&!w.dead))k=ids.find(x=>!CARDS[x].wall)||k;
 B.e.ai-=CARDS[k].cost;deploy('ai',k,rnd(0,2))}
function deploy(s,k,ln){const c=CARDS[k],m=s==='me',sg=m?1:-1,pw=m?pwr(k):1+.06*B.lv;
 log(`${m?'':'🤖 '}${role(k)} ${L(c.wall?'built':'dep')}`);sfx('deploy',60);if(!ok)return;
 if(c.wall){const hp=c.hp*pw*(m?1+.15*(S.wall-1):1);G(()=>{for(const x of[-3.2,0,3.2]){const g=new THREE.Group();const ws=mkWallSeg(k);ws.g.rotation.y=sg>0?Math.PI:0;g.add(ws.g);const b=mkBar(2,0xffb03a);b.position.y=ws.h+.5;g.add(b);g.position.set(x,0,sg*(TZ-6.4));shade(g);sc.add(g);
  B.w.push({s,x,z:sg*(TZ-6.4),hp,max:hp,mesh:g,bar:b})}});return}
 for(let i=0;i<c.cnt;i++){const hold=c.hold,st=c.cnt>4?2.2:3,x=hold?(i-(c.cnt-1)/2)*st:[-3.5,0,3.5][ln]+(i-(c.cnt-1)/2)*.9,z=sg*(hold?TZ-7.6:TZ-4.8);
  const g=new THREE.Group(),md=mkUnit(k,m?ucol(k):0x8a2a9a,1.15*c.sz);md.rotation.y=m?Math.PI:0;g.add(md);shade(md);
  const b=mkBar(1.1,m?0x44dd66:0xff5566);b.position.y=BY[k]||(c.type==='mach'||c.type==='beast'?3:2.1)*c.sz;g.add(b);g.position.set(x,0,z);sc.add(g);
  B.u.push({s,k,x,z,hp:c.hp*pw,max:c.hp*pw,dmg:c.dmg*pw,rate:c.rate||1,rng:c.rng,spd:hold?0:c.spd,melee:c.rng<3,armor:c.armor||1,rarmor:c.rarmor||1,wallx:c.wallx||1,aoe:c.aoe||0,heal:c.heal,cd:rnd(0,8)/10,mesh:g,bar:b})}}
function hit(t,a,mx){let d=a.dmg*(mx||1);d*=a.melee?(t.armor||1):(t.rarmor||1);t.hp-=d;setBar(t.bar,t.hp/t.max);puff(t.mesh.position.x,1,t.mesh.position.z,0xffdd88,2);sfx('hit',90);
 if(t.hp<=0){t.dead=true;sc.remove(t.mesh);puff(t.mesh.position.x,.8,t.mesh.position.z,t.k?0xbbbbbb:0xa08060,6);if(!t.k)sfx('wall',150)}}
function bolt(a,b){const m=box(.07,.07,.6,0xffe27a,0,0,0);sc.add(m);B.bolts.push({m,a:new THREE.Vector3(a.x,a.h||1.2,a.z),b:new THREE.Vector3(b.x,1,b.z),t:0});sfx('shot',120)}
function bolts(dt){if(!B||!B.bolts)return;B.bolts=B.bolts.filter(o=>{o.t+=dt/.3;o.m.position.lerpVectors(o.a,o.b,Math.min(1,o.t));o.m.lookAt(o.b);if(o.t>=1){sc.remove(o.m);return false}return true})}
function sim(dt){
 for(const u of B.u){if(u.dead)continue;const dir=u.s==='me'?-1:1;u.cd-=dt;
  if(u.heal){if(u.cd<=0){let a=null,bh=1;for(const v of B.u){if(v.s!==u.s||v.dead||v===u||v.hp>=v.max||Math.hypot(v.x-u.x,v.z-u.z)>u.rng)continue;const f=v.hp/v.max;if(f<bh){bh=f;a=v}}
    if(a){u.cd=u.rate;a.hp=Math.min(a.max,a.hp+u.dmg);setBar(a.bar,a.hp/a.max);bolt(u,a);puff(a.mesh.position.x,1.2,a.mesh.position.z,0x66ff88,2)}}continue}
  let tg=null,bd=u.rng;
  for(const v of B.u){if(v.s===u.s||v.dead)continue;const d=Math.hypot(v.x-u.x,v.z-u.z);
   if(d<bd&&!(u.melee&&B.w.some(w=>!w.dead&&w.s!==u.s&&Math.abs(w.x-u.x)<1.8&&(w.z-u.z)*(w.z-v.z)<0))){bd=d;tg=v}}
  let wl=null;if(!tg&&u.melee)for(const w of B.w){if(w.s===u.s||w.dead)continue;const dz=(w.z-u.z)*dir;if(dz>-.3&&dz<1.4&&Math.abs(w.x-u.x)<1.8){wl=w;break}}
  const tz=dir*TZ,atT=!tg&&!wl&&Math.abs(tz-u.z)<u.rng+2.4;
  if(tg||wl||atT){if(u.cd<=0){u.cd=u.rate;
    if(tg){hit(tg,u);if(u.aoe)for(const v of B.u){if(v.s!==u.s&&!v.dead&&v!==tg&&Math.hypot(v.x-tg.x,v.z-tg.z)<u.aoe)hit(v,u,.6)}}
    else if(wl)hit(wl,u,u.wallx);else{B[u.s==='me'?'en':'me']-=u.dmg;puff(0,3,tz,0xffaa55,2)}
    if(!u.melee)bolt(u,tg||{x:0,z:tz})}}
  else if(u.spd){u.z+=dir*u.spd*dt;u.mesh.position.z=u.z;u.mesh.children[0].position.y=Math.abs(Math.sin(performance.now()/110+u.x))*.1}}
 for(const s of['me','ai']){B.tw[s]-=dt;if(B.tw[s]>0)continue;const tz=s==='me'?TZ:-TZ;let tg=null,bd=9;
  for(const v of B.u){if(v.dead||v.s===s)continue;const d=Math.hypot(v.x,v.z-tz);if(d<bd){bd=d;tg=v}}
  if(tg){B.tw[s]=1.6;hit(tg,{dmg:s==='me'?16+2*S.keep:14+2*B.lv,melee:false});bolt({x:0,z:tz,h:5},tg)}}
 B.u=B.u.filter(u=>!u.dead);B.w=B.w.filter(w=>!w.dead);
 if(B.en<=0)finish('win');else if(B.me<=0)finish('lose')}
function finish(r){if(B.over)return;B.over=true;clearInterval(tm);upd();for(const x of['acts','lane'])$(x).classList.add('hide');
 if(r!=='draw')G(()=>{const f=r==='win'?en:me;f.userData.fall=1;f.scale.y=.25;f.rotation.z=.35;f.userData.crown.position.y=.6});
 let h='';
 if(r==='win'){const bo=Math.min(S.streak,5),c=22+bo*3,g=12+bo*2;S.crowns+=c;S.gold+=g;S.streak++;S.cw=(S.cw||0)+1;
  h+=`<div class="row"><span>👑 ${L('crowns')}</span><b>+${c}</b></div><div class="row"><span>🪙 ${L('coinsN')}</span><b>+${g}</b></div>`;
  if(S.pass<PASSMAX){S.pass++;const p=passR(S.pass);let ls=null;
   if(p.coins)S.gold+=p.coins;else if(p.chest!==undefined)ls=giveChest(p.chest);else{const nw=!S.cards[p.card];S.cards[p.card]=(S.cards[p.card]||0)+1;ls=[[p.card,nw]]}
   h+=`<div class="row"><span>🎫 ${L('passT')} ${lvBadge(S.pass)}</span><b>${passTxt(p)}</b></div>`+(ls?cardsH(ls):'')}
  if(S.cw>=3){S.cw=0;const t=Math.random()<.7?0:Math.random()<.85?1:2;h+=`<div class="row"><span>📦 ${L('win3got')}</span><b>${chn(CH[t])}</b></div>`+cardsH(giveChest(t));setTimeout(()=>sfx('open'),700)}
  else h+=`<div class="row sub"><span>📦 ${L('win3')}</span><span>${S.cw}/3</span></div>`;
  $('vicT').textContent=L('win');sfx('win')}
 else if(r==='draw'){h=`<div class="sub" style="padding:10px 0">${L('drawD')}</div>`;$('vicT').textContent=L('drawT')}
 else{const c=Math.min(S.crowns,18),g=Math.min(S.gold,8);S.crowns-=c;S.gold-=g;S.streak=0;h=`<div class="row"><span>👑 ${L('crowns')}</span><b>-${c}</b></div><div class="row"><span>🪙 ${L('coinsN')}</span><b>-${g}</b></div>`;$('vicT').textContent=L('lose');sfx('lose')}
 $('vicB').innerHTML=h;$('vic').classList.remove('hide');save();hud()}
$('lane').onclick=e=>{const b=e.target.closest('button');if(!b)return;lane=+b.dataset.l;[...$('lane').children].forEach(x=>x.classList.toggle('on',x===b))};
$('fight').onclick=()=>startBattle();
$('acts').onclick=e=>{const b=e.target.closest('button');if(b)play(+b.dataset.k)};
$('back').onclick=()=>{inB=false;clearInterval(tm);G(()=>{B.u.forEach(u=>sc.remove(u.mesh));B.w.forEach(w=>sc.remove(w.mesh));B.bolts.forEach(o=>sc.remove(o.m));sc.remove(en);en=null;rebuild()});
 $('bt').classList.add('hide');$('home').classList.remove('hide');$('hud').classList.remove('hide');hud();setTab(tab)};
try{init3D()}catch(e){ok=false;console.error(e)}
hud();setTab('battle');applyLang();resume();
</script>
